! SANITIZED LAB CONFIG - documentation IPs only (RFC 5737), fake secrets
hostname edge-fw-lab
!
enable secret 9 FAKE_HASH_DO_NOT_USE_0000
username netadmin privilege 15 secret 9 FAKE_HASH_DO_NOT_USE_0001
!
interface GigabitEthernet0/0
 description OUTSIDE
 ip address 203.0.113.2 255.255.255.0
 ip access-group OUTSIDE-IN in
!
interface GigabitEthernet0/1
 description INSIDE
 ip address 192.0.2.1 255.255.255.0
!
ip access-list extended OUTSIDE-IN
 10 permit tcp any host 192.0.2.10 eq 443
 20 permit tcp any host 192.0.2.11 eq 22
 30 permit udp any host 192.0.2.53 eq 53
 40 permit ip any any
 50 deny ip any any log
!
ip access-list extended MGMT-ONLY
 10 permit tcp 198.51.100.0 0.0.0.255 any eq 22
 20 deny ip any any log
!
snmp-server community public RO
!
line vty 0 4
 transport input telnet ssh
 access-class MGMT-ONLY in
!
end
