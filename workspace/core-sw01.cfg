! SANITIZED LAB CONFIG - documentation IPs only (RFC 5737), fake secrets
hostname core-sw01-lab
!
enable secret 9 FAKE_HASH_DO_NOT_USE_0002
!
vlan 10
 name USERS
vlan 20
 name SERVERS
!
interface Vlan10
 ip address 192.0.2.129 255.255.255.128
 ip access-group USERS-OUT in
!
interface Vlan20
 ip address 198.51.100.1 255.255.255.0
!
ip access-list extended USERS-OUT
 10 permit tcp 192.0.2.128 0.0.0.127 198.51.100.0 0.0.0.255 eq 443
 20 permit udp 192.0.2.128 0.0.0.127 host 198.51.100.53 eq 53
 30 deny ip any any log
!
ip ssh version 2
line vty 0 4
 transport input ssh
!
end
