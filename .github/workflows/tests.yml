name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks out code and runs tests.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv (same version the project builds with)
        run: python -m pip install "uv==0.12.13"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q
