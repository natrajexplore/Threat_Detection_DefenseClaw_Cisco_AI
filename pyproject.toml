[project]
name = "openclaw-defenseclaw"
version = "0.2.0"
description = "DefenseClaw x OpenClaw NetOps Assistant security lab: governed multi-agent + MCP tooling, evidence capture, dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { email = "natrajexplore@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
dclab = "openclaw_defenseclaw:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
