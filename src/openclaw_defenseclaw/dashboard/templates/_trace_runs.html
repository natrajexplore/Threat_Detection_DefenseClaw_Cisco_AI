{% for e in errors %}<p class="warn-box small">{{ e }}</p>{% endfor %}
{% if runs %}
<ul class="run-list">
{% for r in runs %}
<li><button type="button" class="run" hx-get="/p/trace/run/{{ r.id }}" hx-target="#timeline" hx-push-url="/trace?run={{ r.id }}" data-run="{{ r.id }}">
  <span class="run-title">{{ r.title or "Run without an operator prompt" }}</span>
  <span class="small muted">{{ r.start | ts }}, {{ r.count }} events, {{ r.lanes | length }} participants</span>
  {% if r.blocked %}<span><span class="tag v-block">{{ r.blocked }} blocked</span></span>{% endif %}
</button></li>
{% endfor %}
</ul>
{% else %}<p class="empty">No runs yet. Send a prompt to an agent in OpenClaw, then check back here.</p>{% endif %}
